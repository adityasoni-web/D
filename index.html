const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const DB='dia_trust_db',ST='keys',KID='k';
function dbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function saveKey(k){const db=await dbOpen();return new Promise((res,rej)=>{const t=db.transaction(ST,'readwrite');t.objectStore(ST).put(k,KID);t.oncomplete=res;t.onerror=()=>rej(t.error);});}
async function loadKey(){const db=await dbOpen();return new Promise((res,rej)=>{const q=db.transaction(ST).objectStore(ST).get(KID);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error);});}
async function clearKey(){try{const db=await dbOpen();return new Promise(res=>{const t=db.transaction(ST,'readwrite');t.objectStore(ST).delete(KID);t.oncomplete=res;t.onerror=res;});}catch(e){}}
async function show(key){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(I)},key,d(C));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
  const b=document.createElement('button');
  b.textContent='Lock';
  b.style.cssText='position:fixed;right:8px;bottom:8px;z-index:99999;padding:6px 12px;font-size:12px;background:#222;color:#fff;border:0;border-radius:6px;opacity:.7;cursor:pointer';
  b.onclick=async()=>{await clearKey();location.reload();};
  document.body.appendChild(b);
}
async function unlock(){
  const err=document.getElementById('err');err.textContent='';
  const pw=document.getElementById('pw').value;
  if(!pw){err.textContent='Please enter the password.';return;}
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(S),iterations:N,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const trust=document.getElementById('trust').checked;
    await crypto.subtle.decrypt({name:'AES-GCM',iv:d(I)},key,d(C));
    if(trust){try{await saveKey(key);}catch(e){}}else{await clearKey();}
    await show(key);
  }catch(e){err.textContent='Wrong password.';}
}
(async function init(){
  const box=document.getElementById('box');
  if(!window.crypto||!crypto.subtle){box.style.display='block';document.getElementById('err').textContent='Open this in a modern browser (Chrome, Edge, Safari, Firefox).';return;}
  try{const k=await loadKey();if(k){await show(k);return;}}catch(e){await clearKey();}
  box.style.display='block';
  document.getElementById('pw').focus();
})();
document.getElementById('go').onclick=unlock;
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
</script></body></html>
